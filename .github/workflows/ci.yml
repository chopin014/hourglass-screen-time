name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit & integration tests
        run: npm test
      - name: Lint extension (web-ext)
        run: npm run lint
      - name: Build package
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hourglass-xpi
          path: web-ext-artifacts/*.xpi
