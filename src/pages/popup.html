<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Screen Time</title>
  <link rel="stylesheet" href="ios.css">
  <style>
    body { width: 370px; min-height: 200px; padding: 14px 12px 14px; font-size: 15px; }
    .head { display: flex; align-items: center; gap: 10px; padding: 2px 6px 12px; }
    .head .tile { --size: 26px; }
    .head h1 { margin: 0; font-size: 17px; font-weight: 650; flex: 1; }
    .head .open { color: var(--blue); font-size: 15px; }
    .card + .card { margin-top: 12px; }
    .summary { padding: 16px 16px 10px; }
    .summary .lbl { color: var(--label-2); font-size: 14px; }
    .summary .big { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 2px 0 12px; font-variant-numeric: tabular-nums; }
    .summary .chart .plot { height: 64px; }
    .summary .chart .xlabels { font-size: 12px; }
    .summary .chart { --axis-w: 34px; }
    .summary .chart .gl span { font-size: 11px; }
    .current { padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
    .current .tile { --size: 44px; }
    .current .body { flex: 1; min-width: 0; }
    .current .name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .current .status { color: var(--label-2); font-size: 14px; margin-top: 2px; }
    .current .status.warn { color: var(--orange); }
    .current .status.bad { color: var(--red); }
    .progress { height: 6px; border-radius: 3px; background: var(--fill); margin-top: 8px; overflow: hidden; }
    .progress i { display: block; height: 100%; background: var(--blue); border-radius: 3px; }
    .progress.warn i { background: var(--orange); }
    .row { min-height: 48px; padding: 8px 16px; gap: 12px; }
    .row.with-tile { --sep-inset: 56px; }
    .row .title { font-size: 15px; }
    .row .detail { font-size: 15px; }
    .row .tile { --size: 28px; }
    .footer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .footer button { height: 42px; border-radius: 21px; background: var(--card); font-size: 15px; font-weight: 500; }
    .footer button:hover { background: var(--card-2); }
    .footer button.primary { background: var(--blue); color: #fff; }
    .sched { display: flex; gap: 8px; align-items: center; color: var(--label-2); font-size: 13.5px; padding: 10px 6px 0; }
    .sched .glyph { font-size: 15px; }
    .off { padding: 18px 16px; text-align: center; color: var(--label-2); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
